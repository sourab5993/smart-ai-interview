<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart AI Interview Preparation &amp; Evaluation</title>
    <meta name="description" content="Universal AI Interview Coach for all academic courses &amp; careers with 3D interface, voice analysis, and ML readiness predictor." />
    <meta property="og:title" content="Smart AI Interview Preparation &amp; Evaluation" />
    <meta property="og:description" content="Universal AI Interview Coach for all academic courses &amp; careers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      body {
        margin: 0;
        background-color: #020617;
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 0.3; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes spinFast {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; padding: 20px;">
        <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(6, 182, 212, 0.4); animation: pulseRing 2s ease-in-out infinite;"></div>
          <div style="width: 48px; height: 48px; border: 3px solid rgba(6, 182, 212, 0.15); border-top-color: #06b6d4; border-radius: 50%; animation: spinFast 0.8s linear infinite;"></div>
          <span style="position: absolute; font-size: 18px;">✨</span>
        </div>
        <h2 style="margin-top: 24px; font-size: 18px; font-weight: 700; background: linear-gradient(to right, #22d3ee, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.02em;">
          Smart AI Interview Coach
        </h2>
        <p style="margin-top: 8px; font-size: 13px; color: #64748b; letter-spacing: 0.05em; font-family: monospace;">
          Loading Universal AI Engine...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
